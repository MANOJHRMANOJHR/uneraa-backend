openapi: 3.0.0
info:
  title: super dev Backend API
  version: 1.0.0
  description: API documentation for super dev Backend
servers:
  - url: localhost:8080
    description: Local server
paths:
  /:
    get:
      summary: Root endpoint
      description: Returns a welcome message
      responses:
        '200':
          description: A welcome message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Welcome to the super dev Backend API!
  /api/v1/auth/register:
    post:
      summary: User registration
      description: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully!
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input data
  /api/v1/auth/google:
    get:
      summary: Google authentication
      description: Authenticate user with Google
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Authorization code from Google
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User authenticated successfully!
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid authorization code
  /api/v1/auth/github:
    get:
      summary: GitHub authentication
      description: Authenticate user with GitHub
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Authorization code from GitHub
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User authenticated successfully!
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid authorization code 
  /api/v1/auth/discord:
    get:
      summary: Discord authentication
      description: Authenticate user with Discord
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Authorization code from Discord
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User authenticated successfully!
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid authorization code
  /api/v1/post/create:
    post:
      summary: Create a new post
      description: Create a new post with optional image/video upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: My First Post
                content:
                  type: string
                  example: This is the content of my first post.
                tags:
                  type: array
                  items:
                    type: string
                  example: ["tag1", "tag2"]
                imageUrl:
                  type: string
                  example: http://example.com/image.jpg
                markdown:
                  type: string
                  example: "# Markdown Content"
                category:
                  type: string
                  example: categoryId123
                authorId:
                  type: string
                  example: authorId123
                videoUrl:
                  type: string
                  example: http://example.com/video.mp4
                embedUrl:
                  type: string
                  example: http://youtube.com/embed/xyz
                isPublished:
                  type: boolean
                  example: true
                publishedAt:
                  type: string
                  format: date-time
                  example: "2024-06-10T12:00:00Z"
                image:
                  type: string
                  format: binary
                video:
                  type: string
                  format: binary
              required:
                - title
                - content
                - category
                - authorId
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Post created successfully!
                  data:
                    type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input data

  /api/v1/post/update/{id}:
    put:
      summary: Update a post
      description: Update an existing post by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Post ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                imageUrl:
                  type: string
                markdown:
                  type: string
                category:
                  type: string
                authorId:
                  type: string
                videoUrl:
                  type: string
                embedUrl:
                  type: string
                isPublished:
                  type: boolean
                publishedAt:
                  type: string
                  format: date-time
                image:
                  type: string
                  format: binary
                video:
                  type: string
                  format: binary
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Post updated successfully!
                  data:
                    type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to update post

  /api/v1/post/delete/{id}:
    delete:
      summary: Delete a post
      description: Delete a post by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Post ID
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Post deleted successfully!
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Post not found

  /api/v1/post:
    get:
      summary: Get all posts
      description: Fetch a paginated list of posts
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
          description: Number of posts to skip (for pagination)
      responses:
        '200':
          description: Posts fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Posts fetched successfully!
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                    '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Posts not found
